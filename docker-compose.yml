services:
  postgres:
    image: postgres:16
    container_name: pholio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pholio
      POSTGRES_PASSWORD: pholio_dev
      POSTGRES_DB: pholio
    ports:
      - "5432:5432"
    volumes:
      - pholio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pholio -d pholio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pholio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pholio_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: pholio-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  pholio_pgdata:
  pholio_redisdata:
